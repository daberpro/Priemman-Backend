<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priemman API Documentation</title>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: #1e293b;
            --bg-code: #020617;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #3b82f6;
            --method-get: #10b981;
            --method-post: #3b82f6;
            --method-put: #f59e0b;
            --method-delete: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 2rem 1rem;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .logo { font-size: 1.25rem; font-weight: bold; color: var(--accent); margin-bottom: 2rem; display: flex; align-items: center; gap: 0.5rem; }
        .nav-group { margin-bottom: 1.5rem; }
        .nav-title { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; margin-bottom: 0.5rem; padding-left: 0.75rem; }
        .nav-link { display: block; padding: 0.5rem 0.75rem; color: var(--text-muted); text-decoration: none; border-radius: 0.375rem; font-size: 0.875rem; transition: all 0.2s; }
        .nav-link:hover { background-color: rgba(255,255,255,0.05); color: var(--text-main); }
        .nav-link.active { background-color: var(--accent); color: white; }
        .main { margin-left: 260px; flex: 1; padding: 3rem 4rem; max-width: 1000px; }
        .header { margin-bottom: 3rem; border-bottom: 1px solid var(--border); padding-bottom: 2rem; }
        .header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .header p { color: var(--text-muted); }
        .badge-base { display: inline-block; background: var(--bg-code); padding: 0.25rem 0.75rem; border-radius: 999px; font-family: monospace; font-size: 0.875rem; margin-top: 1rem; border: 1px solid var(--border); }
        .endpoint-card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 0.5rem; margin-bottom: 1rem; overflow: hidden; }
        details { cursor: pointer; }
        details[open] summary { border-bottom: 1px solid var(--border); }
        summary { padding: 1rem 1.5rem; font-weight: 600; font-size: 1.1rem; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        summary::-webkit-details-marker { display: none; }
        summary:hover { background-color: rgba(255,255,255,0.02); }
        .path-text { font-family: monospace; color: var(--text-main); }
        .methods-preview { display: flex; gap: 0.5rem; }
        .method-badge { font-size: 0.7rem; font-weight: bold; padding: 0.2rem 0.5rem; border-radius: 0.25rem; color: white; }
        .bg-get { background-color: var(--method-get); }
        .bg-post { background-color: var(--method-post); }
        .bg-put { background-color: var(--method-put); }
        .bg-delete { background-color: var(--method-delete); }
        .method-content { padding: 1.5rem; }
        .method-item { margin-bottom: 2rem; border-left: 3px solid var(--border); padding-left: 1rem; }
        .method-item:last-child { margin-bottom: 0; }
        .method-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .method-verb { font-size: 0.875rem; font-weight: bold; width: 60px; }
        .tabs { display: flex; gap: 1rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
        .tab-btn { background: none; border: none; color: var(--text-muted); padding: 0.5rem 0; cursor: pointer; font-size: 0.875rem; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        pre { background-color: var(--bg-code); padding: 1rem; border-radius: 0.375rem; overflow-x: auto; font-size: 0.875rem; border: 1px solid var(--border); }
        code { font-family: 'Fira Code', monospace; }
        .empty-state { text-align: center; padding: 4rem; color: var(--text-muted); }
        .note { font-size: 0.875rem; color: var(--text-muted); margin-top: 0.5rem; font-style: italic; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            Priemman API
        </div>
        <div class="nav-group">
            <div class="nav-title">Overview</div>
            <a href="#all" class="nav-link" data-filter="all">All Endpoints</a>
        </div>
        <div class="nav-group">
            <div class="nav-title">Resources</div>
            <a href="#auth" class="nav-link" data-filter="auth">Auth</a>
            <a href="#users" class="nav-link" data-filter="users">Users</a>
            <a href="#projects" class="nav-link" data-filter="projects">Projects</a>
            <a href="#collections" class="nav-link" data-filter="collections">Collections</a>
            <a href="#media" class="nav-link" data-filter="media">Media</a>
            <a href="#admin" class="nav-link" data-filter="admin">Admin</a>
        </div>
    </aside>

    <main class="main" id="app"></main>

    <script>
        // DATA LENGKAP SEMUA ENDPOINT
        const apiData = [
            // ================= AUTH =================
            { group: "auth", path: "/v1/auth/send-otp", methods: [{ verb: "POST", summary: "Kirim OTP", desc: "Mengirim kode OTP 6 digit ke email. Cooldown 30 detik.", proto: `message SendOtpRequest { string email = 1; }\nmessage SendOtpResponse { bool success = 1; string message = 2; int32 cooldown_seconds = 3; }`, curl: `curl -X POST http://localhost:8080/v1/auth/send-otp \\\n  -H "Content-Type: application/x-protobuf" \\\n  --data-binary "@send_otp.pb"` }] },
            { group: "auth", path: "/v1/auth/verify-otp", methods: [{ verb: "POST", summary: "Verifikasi OTP", desc: "Verifikasi kode OTP. Mengembalikan session token.", proto: `message VerifyOtpRequest { string email = 1; string otp = 2; }\nmessage VerifyOtpResponse { string session_token = 1; bool is_new_user = 2; }`, curl: `curl -X POST http://localhost:8080/v1/auth/verify-otp \\\n  -H "Content-Type: application/x-protobuf"` }] },
            { group: "auth", path: "/v1/auth/logout", methods: [{ verb: "POST", summary: "Logout", desc: "Menghapus session token aktif.", proto: `message LogoutRequest { string session_token = 1; }\nmessage LogoutResponse { bool success = 1; }`, curl: `curl -X POST http://localhost:8080/v1/auth/logout \\\n  -H "Authorization: Bearer <token>"` }] },

            // ================= USERS =================
            { group: "users", path: "/v1/users/me", methods: [
                { verb: "GET", summary: "Get Current Profile", desc: "Mengambil profil lengkap pengguna yang sedang login.", proto: `// Response: User\nmessage User {\n  ObjectId id = 1;\n  string email = 2;\n  string first_name = 3;\n  UserRole role = 16;\n  repeated WorkExperience work_experience = 11;\n  // ...\n}`, curl: `curl -X GET http://localhost:8080/v1/users/me \\\n  -H "Authorization: Bearer <token>" \\\n  -H "Accept: application/x-protobuf"` },
                { verb: "PUT", summary: "Update Basic Info", desc: "Memperbarui informasi dasar profil (nama, headline, lokasi, dll).", proto: `message UpdateBasicInfoRequest {\n  optional string first_name = 1;\n  optional string last_name = 2;\n  optional string headline = 3;\n  Location location = 5;\n  Media avatar_replace_media = 8;\n}`, curl: `curl -X PUT http://localhost:8080/v1/users/me \\\n  -H "Authorization: Bearer <token>" \\\n  -H "Content-Type: application/x-protobuf"` }
            ]},
            { group: "users", path: "/v1/users/me/work-experiences", methods: [
                { verb: "GET", summary: "List Work Experiences", desc: "Daftar pengalaman kerja pengguna.", proto: `message ListWorkExperienceResponse {\n  repeated WorkExperience entries = 1;\n}`, curl: `curl -X GET http://localhost:8080/v1/users/me/work-experiences \\\n  -H "Authorization: Bearer <token>"` },
                { verb: "POST", summary: "Upsert Work Experience", desc: "Tambah atau update pengalaman kerja. (id kosong = buat baru).", proto: `message UpsertWorkExperienceRequest {\n  WorkExperience entry = 1;\n}\nmessage WorkExperience {\n  ObjectId id = 1;\n  string title = 2;\n  string company = 3;\n  bool is_current = 4;\n  string description = 7;\n}`, curl: `curl -X POST http://localhost:8080/v1/users/me/work-experiences \\\n  -H "Authorization: Bearer <token>" \\\n  -H "Content-Type: application/x-protobuf"` },
                { verb: "DELETE", summary: "Delete Work Experience", desc: "Menghapus pengalaman kerja berdasarkan ID.", proto: `message DeleteWorkExperienceRequest {\n  ObjectId id = 1;\n}\nmessage DeleteResponse { bool success = 1; }`, curl: `curl -X DELETE http://localhost:8080/v1/users/me/work-experiences \\\n  -H "Authorization: Bearer <token>"` }
            ]},
            { group: "users", path: "/v1/users/me/connected-accounts", methods: [
                { verb: "GET", summary: "List Connected Accounts", desc: "Daftar akun sosial media yang terhubung (Instagram, LinkedIn, GitHub).", proto: `message ListConnectedAccountsResponse {\n  repeated ConnectedAccount accounts = 1;\n}`, curl: `curl -X GET http://localhost:8080/v1/users/me/connected-accounts \\\n  -H "Authorization: Bearer <token>"` },
                { verb: "DELETE", summary: "Delete Connected Account", desc: "Memutus koneksi akun sosial media.", proto: `message DeleteConnectedAccountRequest {\n  ConnectedPlatform platform = 1;\n}`, curl: `curl -X DELETE http://localhost:8080/v1/users/me/connected-accounts \\\n  -H "Authorization: Bearer <token>"` }
            ]},
            { group: "users", path: "/v1/users/me/upgrade", methods: [
                { verb: "GET", summary: "Get Upgrade Status", desc: "Cek status upgrade ke Creator (none/pending/approved/rejected/paid).", proto: `message UpgradeStatus {\n  string status = 1;\n  ObjectId request_id = 2;\n  string invoice_id = 3;\n  int64 invoice_amount = 4;\n}`, curl: `curl -X GET http://localhost:8080/v1/users/me/upgrade \\\n  -H "Authorization: Bearer <token>"` },
                { verb: "POST", summary: "Request Upgrade", desc: "Mengajukan permintaan upgrade ke role Creator.", proto: `// Request body kosong\n// Response: CreateUpgradeRequestResponse`, curl: `curl -X POST http://localhost:8080/v1/users/me/upgrade \\\n  -H "Authorization: Bearer <token>"` }
            ]},
            { group: "users", path: "/v1/users/public", methods: [{ verb: "GET", summary: "Get Public Profile", desc: "Mengambil profil publik pengguna berdasarkan query param user_id.", proto: `// Query Param: ?user_id=...\n// Response: UserProfile\nmessage UserProfile {\n  ObjectId id = 1;\n  string first_name = 3;\n  string headline = 5;\n  repeated WorkExperience work_experience = 16;\n}`, curl: `curl -X GET "http://localhost:8080/v1/users/public?user_id=123" \\\n  -H "Accept: application/x-protobuf"` }] },
            { group: "users", path: "/v1/users/upgrade-logs", methods: [{ verb: "GET", summary: "Get Upgrade Logs", desc: "Riwayat permintaan upgrade (query param: limit, offset).", proto: `message UpgradeLogs { repeated UpgradeLog logs = 1; }`, curl: `curl -X GET "http://localhost:8080/v1/users/upgrade-logs?limit=20&offset=0" \\\n  -H "Authorization: Bearer <token>"` }] },

            // ================= PROJECTS =================
            { group: "projects", path: "/v1/projects", methods: [{ verb: "POST", summary: "Create Project", desc: "Membuat project showcase baru. (Catatan: ProjectInput pakai 'content' & 'tags').", proto: `message CreateProjectRequest { ProjectInput input = 1; }\nmessage ProjectInput {\n  string title = 1;\n  string content = 8;\n  repeated string tags = 2;\n  ProjectVisibility visibility = 5;\n  ProjectStatus status = 6;\n  repeated Media media = 3;\n}`, curl: `curl -X POST http://localhost:8080/v1/projects \\\n  -H "Authorization: Bearer <token>" \\\n  -H "Content-Type: application/x-protobuf"` }] },
            { group: "projects", path: "/v1/projects/list", methods: [{ verb: "GET", summary: "List My Projects", desc: "Daftar project milik pengguna yang login.", proto: `message ListProjectsResponse {\n  repeated Project projects = 1;\n  string next_page_token = 2;\n}`, curl: `curl -X GET http://localhost:8080/v1/projects/list \\\n  -H "Authorization: Bearer <token>"` }] },
            { group: "projects", path: "/v1/projects/{id}", methods: [
                { verb: "GET", summary: "Get Project Detail", desc: "Detail lengkap satu project.", proto: `message ProjectResponse { Project project = 1; }`, curl: `curl -X GET http://localhost:8080/v1/projects/{id} \\\n  -H "Authorization: Bearer <token>"` },
                { verb: "PUT", summary: "Update Project", desc: "Update project. Wajib kirim field yang ingin diupdate.", proto: `message UpdateProjectRequest {\n  ObjectId id = 1;\n  ProjectInput input = 2;\n}`, curl: `curl -X PUT http://localhost:8080/v1/projects/{id} \\\n  -H "Authorization: Bearer <token>"` },
                { verb: "DELETE", summary: "Delete Project", desc: "Menghapus project secara permanen.", proto: `message DeleteResponse { bool success = 1; }`, curl: `curl -X DELETE http://localhost:8080/v1/projects/{id} \\\n  -H "Authorization: Bearer <token>"` }
            ]},

            // ================= COLLECTIONS =================
            { group: "collections", path: "/v1/collections", methods: [
                { verb: "POST", summary: "Create Collection", desc: "Membuat koleksi untuk mengelompokkan project.", proto: `message CreateCollectionRequest { CollectionInput input = 1; }\nmessage CollectionInput {\n  string title = 1;\n  string description = 2;\n  repeated ObjectId project_ids = 4;\n}`, curl: `curl -X POST http://localhost:8080/v1/collections \\\n  -H "Authorization: Bearer <token>"` },
                { verb: "DELETE", summary: "Delete Collection", desc: "Menghapus koleksi.", proto: `message DeleteCollectionRequest { ObjectId id = 1; }`, curl: `curl -X DELETE http://localhost:8080/v1/collections \\\n  -H "Authorization: Bearer <token>"` }
            ]},

            // ================= MEDIA =================
            { group: "media", path: "/v1/media/upload", methods: [{ verb: "POST", summary: "Upload Media", desc: "Upload file ke Cloudinary. Menggunakan multipart/form-data.", proto: `message UploadMediaBatchResponse {\n  repeated UploadMediaResponse items = 1;\n}\nmessage UploadMediaResponse {\n  string url = 1;\n  string public_id = 5; // Wajib untuk delete\n  MediaType type = 2;\n}`, curl: `curl -X POST http://localhost:8080/v1/media/upload \\\n  -H "Authorization: Bearer <token>" \\\n  -F "file=@photo.jpg"` }] },

            // ================= ADMIN =================
            { group: "admin", path: "/v1/admin/users", methods: [{ verb: "GET", summary: "List Users", desc: "Hanya ADMIN. List semua user dengan pagination & filter role.", proto: `message AdminListUsersResponse {\n  repeated AdminUserEntry users = 1;\n  int32 total = 2;\n  int32 limit = 3;\n  int32 offset = 4;\n}`, curl: `curl -X GET "http://localhost:8080/v1/admin/users?limit=20&offset=0&role=creator" \\\n  -H "Authorization: Bearer <admin_token>"` }] },
            { group: "admin", path: "/v1/admin/upgrades", methods: [{ verb: "GET", summary: "List Upgrade Requests", desc: "Hanya ADMIN. List permintaan upgrade (query: status=pending/approved/etc).", proto: `message AdminListUpgradeRequestsResponse {\n  repeated UpgradeRequestEntry requests = 1;\n}`, curl: `curl -X GET "http://localhost:8080/v1/admin/upgrades?status=pending" \\\n  -H "Authorization: Bearer <admin_token>"` }] },
            { group: "admin", path: "/v1/admin/upgrades/review", methods: [{ verb: "POST", summary: "Review Upgrade", desc: "Hanya ADMIN. Approve atau Reject permintaan upgrade.", proto: `message AdminReviewUpgradeRequest {\n  ObjectId id = 1;\n  bool approve = 2;\n  string rejection_reason = 3;\n}`, curl: `curl -X POST http://localhost:8080/v1/admin/upgrades/review \\\n  -H "Authorization: Bearer <admin_token>"` }] },
            { group: "admin", path: "/v1/admin/upgrades/confirm-payment", methods: [{ verb: "POST", summary: "Confirm Payment", desc: "Hanya ADMIN. Konfirmasi pembayaran upgrade untuk menaikkan role user.", proto: `message AdminConfirmPaymentRequest { ObjectId id = 1; }`, curl: `curl -X POST http://localhost:8080/v1/admin/upgrades/confirm-payment \\\n  -H "Authorization: Bearer <admin_token>"` }] }
        ];

        const app = document.getElementById('app');

        function render(filter = 'all') {
            const filteredData = filter === 'all' ? apiData : apiData.filter(item => item.group === filter);
            let html = `
                <div class="header">
                    <h1>Priemman API Docs</h1>
                    <p>Dokumentasi lengkap REST API backend Priemman. Format: Protobuf Binary.</p>
                    <div class="badge-base">Base URL: http://localhost:8080</div>
                </div>
            `;
            if (filteredData.length === 0) {
                html += `<div class="empty-state">Tidak ada endpoint untuk kategori ini.</div>`;
            } else {
                filteredData.forEach(endpoint => {
                    const badges = endpoint.methods.map(m => `<span class="method-badge bg-${m.verb.toLowerCase()}">${m.verb}</span>`).join('');
                    html += `
                        <div class="endpoint-card">
                            <details open>
                                <summary>
                                    <span class="path-text">${endpoint.path}</span>
                                    <div class="methods-preview">${badges}</div>
                                </summary>
                                <div class="method-content">
                    `;
                    endpoint.methods.forEach((method, idx) => {
                        const tabId = `tab-${endpoint.path.replace(/[^a-zA-Z0-9]/g,'')}-${idx}`;
                        html += `
                            <div class="method-item">
                                <div class="method-header">
                                    <span class="method-verb method-badge bg-${method.verb.toLowerCase()}">${method.verb}</span>
                                    <h3>${method.summary}</h3>
                                </div>
                                <p style="color: var(--text-muted); margin-bottom: 1rem;">${method.desc}</p>
                                <div class="tabs">
                                    <button class="tab-btn active" onclick="switchTab(event, '${tabId}', 'overview')">Overview</button>
                                    <button class="tab-btn" onclick="switchTab(event, '${tabId}', 'proto')">Proto</button>
                                    <button class="tab-btn" onclick="switchTab(event, '${tabId}', 'curl')">cURL</button>
                                </div>
                                <div id="${tabId}-overview" class="tab-content active">
                                    <p>Gunakan header <code>Content-Type: application/x-protobuf</code> dan <code>Accept: application/x-protobuf</code>.</p>
                                    <p class="note">Auth: Tambahkan header <code>Authorization: Bearer &lt;session_token&gt;</code> untuk endpoint berlabel AUTH.</p>
                                </div>
                                <div id="${tabId}-proto" class="tab-content">
                                    <pre><code>${method.proto}</code></pre>
                                </div>
                                <div id="${tabId}-curl" class="tab-content">
                                    <pre><code>${method.curl}</code></pre>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div></details></div>`;
                });
            }
            app.innerHTML = html;
            updateSidebarActive(filter);
        }

        function switchTab(event, tabId, type) {
            event.preventDefault();
            document.querySelectorAll(`[id^="${tabId}-"]`).forEach(el => el.classList.remove('active'));
            document.getElementById(`${tabId}-${type}`).classList.add('active');
            const parent = event.target.parentElement;
            parent.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function updateSidebarActive(filter) {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.toggle('active', link.dataset.filter === filter);
            });
        }

        function handleRoute() {
            const hash = window.location.hash.replace('#', '') || 'all';
            render(hash);
        }

        window.addEventListener('hashchange', handleRoute);
        window.addEventListener('DOMContentLoaded', handleRoute);
    </script>
</body>
</html>

syntax = "proto3";
package priemman.v1;
import "common.proto";
import "google/protobuf/timestamp.proto";

enum ConnectedPlatform {
  CONNECTED_PLATFORM_UNSPECIFIED = 0;
  CONNECTED_PLATFORM_INSTAGRAM = 1;
  CONNECTED_PLATFORM_LINKEDIN = 2;
  CONNECTED_PLATFORM_GITHUB = 3;
}

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_USER = 1;
  USER_ROLE_CREATOR = 2;
  USER_ROLE_ADMIN = 3;
}

message WorkExperience {
  ObjectId id = 1;
  string title = 2;
  string company = 3;
  bool is_current = 4;
  google.protobuf.Timestamp start_date = 5;
  google.protobuf.Timestamp end_date = 6; // kosong jika is_current = true
  string description = 7;
}

message ConnectedAccount {
  ConnectedPlatform platform = 1;
  string handle_or_url = 2;
  bool verified = 3;
  google.protobuf.Timestamp connected_at = 4;
}

message AboutMe {
  string title = 1;
  string description = 2;
}

message User {
  ObjectId id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string headline = 5;
  string company = 6;
  Location location = 7;
  string website_url = 8;
  string avatar_url = 9;
  bool is_onboarded = 10;
  repeated WorkExperience work_experience = 11;
  repeated ConnectedAccount connected_accounts = 12;
  AboutMe about_me = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  UserRole role = 16;
}

// ---- Account API messages ----

message UpdateBasicInfoRequest {
  string first_name = 1;
  string last_name = 2;
  string headline = 3;
  string company = 4;
  Location location = 5;
  string website_url = 6;
}

message UpsertWorkExperienceRequest {
  WorkExperience entry = 1; // id kosong = create baru
}

// ---- Account API (tambahan) ----
message ListWorkExperienceResponse {
    repeated WorkExperience entries = 1;
}
message DeleteWorkExperienceRequest {
    ObjectId id = 1;
}
message ListConnectedAccountsResponse {
    repeated ConnectedAccount accounts = 1;
}
message DeleteConnectedAccountRequest {
    ConnectedPlatform platform = 1;
}

// ---- Creator upgrade flow ----

message UpgradeStatus {
  string status = 1; // 'none' | 'pending' | 'approved' | 'rejected' | 'paid'
  ObjectId request_id = 2;
  string invoice_id = 3;
  int64 invoice_amount = 4;
  string currency = 5;
  string rejection_reason = 6;
  google.protobuf.Timestamp requested_at = 7;
  google.protobuf.Timestamp reviewed_at = 8;
  google.protobuf.Timestamp paid_at = 9;
}

message CreateUpgradeRequestResponse {
  bool success = 1;
  UpgradeStatus status = 2;
}

// ---- Admin API ----

message AdminUserEntry {
  ObjectId id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  UserRole role = 5;
  google.protobuf.Timestamp created_at = 6;
}

message AdminListUsersResponse {
  repeated AdminUserEntry users = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message UpgradeRequestEntry {
  ObjectId id = 1;
  ObjectId user_id = 2;
  string email = 3;
  string status = 4;
  string invoice_id = 5;
  int64 invoice_amount = 6;
  string currency = 7;
  string rejection_reason = 8;
  google.protobuf.Timestamp requested_at = 9;
}

message AdminListUpgradeRequestsResponse {
  repeated UpgradeRequestEntry requests = 1;
}

message AdminReviewUpgradeRequest {
  ObjectId id = 1;
  bool approve = 2;
  string rejection_reason = 3;
}

message AdminReviewUpgradeResponse {
  bool success = 1;
  UpgradeRequestEntry request = 2;
}

message AdminConfirmPaymentRequest {
  ObjectId id = 1;
}

message AdminConfirmPaymentResponse {
  bool success = 1;
  ObjectId user_id = 2;
}

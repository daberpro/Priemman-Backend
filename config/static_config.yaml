components_manager:
    components:
        server:
            listener:
                port: $server-port
                port#fallback: 8080
                task_processor: main-task-processor

        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: $log-file-path
                    file_path#fallback: '@stderr'
                    level: $log-level
                    level#fallback: info

        cors-middleware:
            allowed-origins:
                - https://priemman.my.id
                - http://localhost:3000
            allow-credentials: true
            allowed-headers:
                - Content-Type
                - Authorization
            max-age-seconds: 86400

        rate-limiter-middleware:
            requests-per-minute: 60

        default-server-middleware-pipeline-builder:
            append:
                - cors-middleware
                - rate-limiter-middleware

# ============== Dynamic Config (content type untuk file statis) ==============
        dynamic-config:
            defaults:
                USERVER_FILES_CONTENT_TYPE_MAP:
                    .css: "text/css"
                    .gif: "image/gif"
                    .htm: "text/html; charset=utf-8"
                    .html: "text/html; charset=utf-8"
                    .ico: "image/x-icon"
                    .jpeg: "image/jpeg"
                    .jpg: "image/jpeg"
                    .js: "application/javascript"
                    .json: "application/json"
                    .md: "text/markdown"
                    .png: "image/png"
                    .svg: "image/svg+xml"
                    .txt: "text/plain; charset=utf-8"
                    .woff: "font/woff"
                    .woff2: "font/woff2"

# ============== Cloudinary Component ==============
        cloudinary-client-component:
            cloud_name: $cloudinary-cloud-name
            cloud_name#fallback: "dummy-cloud"
            api_key: $cloudinary-api-key
            api_key#fallback: "dummy-key"
            api_secret: $cloudinary-api-secret
            api_secret#fallback: "dummy-secret"

# ============== Media Orphan Sweeper ==============
        media-sweeper:
            task-processor: main-task-processor
            interval-seconds: 3600   # sweep tiap 1 jam
            ttl-seconds: 86400       # orphan > 24 jam dihapus
            batch-limit: 100

# ============== Static Files (Landing Page) ==============
        fs-cache-static:
            dir: $static-dir
            dir#fallback: ../static
            fs-task-processor: fs-task-processor

# ============== Handlers ==============
        handler-static:  # Landing page statis di path /
            fs-cache-component: fs-cache-static
            path: /
            method: GET
            task_processor: main-task-processor
            directory-file: index.html

        handler-api-info:
            path: /v1/info
            method: GET,OPTIONS
            task_processor: main-task-processor

        handler-project-create:
            path: /v1/projects
            method: POST,OPTIONS
            task_processor: main-task-processor
            # TIDAK ADA cloudinary config di sini

        handler-project-list:
            path: /v1/projects/list
            method: GET,OPTIONS
            task_processor: main-task-processor
            # TIDAK ADA cloudinary config di sini

        handler-project-detail:
            path: /v1/projects/{id}
            method: GET,PUT,DELETE,OPTIONS
            task_processor: main-task-processor
            # TIDAK ADA cloudinary config di sini

        handler-collection:
            path: /v1/collections
            method: GET,POST,PUT,DELETE,OPTIONS
            task_processor: main-task-processor
            # TIDAK ADA cloudinary config di sini

        handler-basic-info:
            path: /v1/users/me
            method: GET,PUT,PATCH,OPTIONS
            task_processor: main-task-processor
            # TIDAK ADA cloudinary config di sini

        handler-work-experience:
            path: /v1/users/me/work-experiences
            method: GET,POST,DELETE,OPTIONS
            task_processor: main-task-processor
            # TIDAK ADA cloudinary config di sini

        handler-connected-accounts:
            path: /v1/users/me/connected-accounts
            method: GET,DELETE,OPTIONS
            task_processor: main-task-processor
            # TIDAK ADA cloudinary config di sini

        handler-send-otp:
            path: /v1/auth/send-otp
            method: POST,OPTIONS
            task_processor: main-task-processor
            email-template-path: $otp-email-template-path
            email-template-path#fallback: ../templates/otp_email.html

        handler-verify-otp:
            path: /v1/auth/verify-otp
            method: POST,OPTIONS
            task_processor: main-task-processor

        handler-logout:
            path: /v1/auth/logout
            method: POST,OPTIONS
            task_processor: main-task-processor

        handler-ping:
            path: /ping
            method: GET,OPTIONS
            task_processor: main-task-processor

        handler-initiate-google-oauth:
            path: /v1/auth/google
            method: GET,OPTIONS
            task_processor: main-task-processor

        handler-callback-google-oauth:
            path: /v1/auth/callback/google
            method: GET,OPTIONS
            task_processor: main-task-processor
            dashboard-url: $dashboard-url
            dashboard-creator-url: $dashboard-creator-url
            dashboard-admin-url: $dashboard-admin-url

        handler-initiate-github-oauth:
            path: /v1/auth/github
            method: GET,OPTIONS
            task_processor: main-task-processor

        handler-callback-github-oauth:
            path: /v1/auth/callback/github
            method: GET,OPTIONS
            task_processor: main-task-processor
            dashboard-url: $dashboard-url
            dashboard-creator-url: $dashboard-creator-url
            dashboard-admin-url: $dashboard-admin-url

        handler-upload-media:
            path: /v1/media/upload
            method: POST,OPTIONS
            task_processor: main-task-processor
            # TIDAK ADA cloudinary config di sini

        handler-upgrade:
            path: /v1/users/me/upgrade
            method: GET,POST,OPTIONS
            task_processor: main-task-processor

        handler-admin-users:
            path: /v1/admin/users
            method: GET,OPTIONS
            task_processor: main-task-processor

        handler-admin-upgrades:
            path: /v1/admin/upgrades
            method: GET,OPTIONS
            task_processor: main-task-processor

        handler-admin-upgrades-review:
            path: /v1/admin/upgrades/review
            method: POST,OPTIONS
            task_processor: main-task-processor

        handler-admin-upgrades-confirm-payment:
            path: /v1/admin/upgrades/confirm-payment
            method: POST,OPTIONS
            task_processor: main-task-processor

# ============== DB ==============
        database:
            max_pool_size: 15
            initial_pool_size: 5

# ============== SecDist ==============
        secdist:
            provider: default-secdist-provider

        default-secdist-provider:
            config: ../config/secdist.json
            format: json
            missing-ok: true

# ============== SMTP ==============
        daberdev-smtp-component-client:
            host: $smtp-host
            port: $smtp-port
            email: $smtp-email
            password: $smtp-password

# ============== OAuth ==============
        daberdev-oauth-google-component:
            auth_url: https://accounts.google.com/o/oauth2/v2/auth
            token_url: https://oauth2.googleapis.com/token
            api_url: https://www.googleapis.com/oauth2/v3/userinfo
            redirect_url: $google-redirect-url
            client_id: $google-client-id
            client_secret: $google-client-secret
            scope: "openid email profile"

        daberdev-oauth-github-component:
            auth_url: https://github.com/login/oauth/authorize
            token_url: https://github.com/login/oauth/access_token
            api_url: https://api.github.com/user
            redirect_url: $github-redirect-url
            client_id: $github-client-id
            client_secret: $github-client-secret
            scope: "read:user user:email"

# ============== Other ==============
        dns-client:
            fs-task-processor: fs-task-processor

        http-client-core:
            pool-statistics-disable: false
            thread-name-prefix: http-client
            threads: 2
            fs-task-processor: fs-task-processor
            destination-metrics-auto-max-size: 100

        http-client:
            core-component: http-client-core

        http-client-middleware-pipeline:
            middlewares: {}

    task_processors:
        main-task-processor:
            worker_threads#env: WORKER_THREADS
            worker_threads#fallback: 4
        fs-task-processor:
            worker_threads: 2

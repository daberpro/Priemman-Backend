name: C++ Build
on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-14 \
            g++-14 \
            pkg-config \
            wget \
            protobuf-compiler \
            libprotobuf-dev \
            mariadb-server \
            mariadb-client \
            libmariadb-dev

      - name: Install CMake 4.4.0
        run: |
          wget -O cmake.sh https://github.com/Kitware/CMake/releases/download/v4.4.0/cmake-4.4.0-linux-x86_64.sh
          sudo sh cmake.sh --skip-license --prefix=/usr/local
          # pastikan /usr/local/bin didahulukan di PATH daripada cmake bawaan apt (kalau ada)
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          gcc-14 --version
          g++-14 --version
          cmake --version
          protoc --version
          mariadb --version

      - name: Install userver
        run: |
          wget -O userver.deb \
            https://github.com/userver-framework/userver/releases/download/v3.1/ubuntu24.04-libuserver-all-dev_3.1_amd64.deb
          sudo apt-get install -y ./userver.deb

      - name: Configure & Build
        working-directory: .
        run: |
          mkdir -p build-ci
          cd build-ci
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14
          cmake --build ./

      - name: Strip binaries (reduce size)
        if: github.event_name == 'push'
        run: |
          strip build-ci/server
          strip build-ci/frontend_server
          ls -lh build-ci/server build-ci/frontend_server

      - name: Upload all artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: priemman-${{ github.ref_name }}-${{ github.sha }}
          path: |
            build-ci/server
            build-ci/frontend_server
            config/
            static/
            templates/
          retention-days: 30
          if-no-files-found: error

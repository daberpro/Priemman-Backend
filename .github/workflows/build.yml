name: C++ Build

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            wget \
            protobuf-compiler \
            libprotobuf-dev \
            mariadb-server \
            mariadb-client \
            libmariadb-dev

      - name: Show toolchain
        run: |
          clang++ --version
          cmake --version
          protoc --version
          mariadb --version

      - name: Install userver
        run: |
          wget -O userver.deb \
            https://github.com/userver-framework/userver/releases/download/v3.1/ubuntu24.04-libuserver-all-dev_3.1_amd64.deb

          sudo apt-get install -y ./userver.deb

      - name: Start MariaDB
        run: |
          sudo systemctl start mariadb
          sudo systemctl status mariadb --no-pager

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build-ci \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: |
          cmake \
            --build build-ci \
            --parallel 2

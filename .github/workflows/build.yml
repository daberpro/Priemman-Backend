name: C++ Build

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-14 \
            g++-14 \
            cmake \
            ninja-build \
            pkg-config \
            wget \
            protobuf-compiler \
            libprotobuf-dev \
            mariadb-server \
            mariadb-client \
            libmariadb-dev

      - name: Show toolchain
        run: |
          gcc-14 --version
          g++-14 --version
          cmake --version
          protoc --version
          mariadb --version

      - name: Install userver
        run: |
          wget -O userver.deb \
            https://github.com/userver-framework/userver/releases/download/v3.1/ubuntu24.04-libuserver-all-dev_3.1_amd64.deb
          sudo apt-get install -y ./userver.deb

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build-ci \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14

      - name: Build
        run: |
          cmake \
            --build build-ci \
            --parallel 2

      # === TAMBAHAN BARU ===
      - name: Strip binaries (reduce size)
        if: github.event_name == 'push'
        run: |
          strip build-ci/server build-ci/frontend_server
          ls -lh build-ci/server build-ci/frontend_server

      - name: Stage artifacts (flat layout)
        if: github.event_name == 'push'
        run: |
          mkdir -p dist-bin dist-config
          cp build-ci/server build-ci/frontend_server dist-bin/
          cp config/static_config.yaml config/frontend_static_config.yaml config/db.sql dist-config/

      - name: Upload server binaries as artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: priemman-server-${{ github.ref_name }}-${{ github.sha }}
          path: dist-bin/
          retention-days: 30
          if-no-files-found: error

      - name: Upload config as artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: priemman-config-${{ github.ref_name }}-${{ github.sha }}
          path: dist-config/
          retention-days: 30
          if-no-files-found: error
      # === END TAMBAHAN ===

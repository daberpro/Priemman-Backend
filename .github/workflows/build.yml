name: C++ Build

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            ninja-build \
            git \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            libssl-dev \
            libjemalloc-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv
            
      - name: Show toolchain
        run: |
          clang++ --version
          cmake --version
          protoc --version

      - name: Clone userver
        run: |
          git clone --depth 1 \
            https://github.com/userver-framework/userver.git \
            userver

      - name: Configure userver
        run: |
          cmake \
            -S userver \
            -B userver/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DUSERVER_FEATURE_CORE=ON \
            -DUSERVER_FEATURE_MYSQL=ON \
            -DUSERVER_INSTALL=ON \
            -DUSERVER_DOWNLOAD_PACKAGES=ON

      - name: Build userver
        run: |
          cmake \
            --build userver/build \
            --parallel 2

      - name: Install userver
        run: |
          sudo cmake \
            --install userver/build

      - name: Configure project
        run: |
          cmake \
            -S . \
            -B build-ci \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build project
        run: |
          cmake \
            --build build-ci \
            --parallel 2
